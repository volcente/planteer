<main class="flex flex-col gap-4 p-4">
	<section class="flex flex-col gap-2">
		<header>
			<h2 class="text-2xl font-medium text-emerald-400">Planteer Workspace</h2>
		</header>

		<div class="overflow-hidden rounded-2xl border border-stone-600">
			<canvas class="aspect-video w-full" #planteerWorkspace></canvas>
		</div>
	</section>

	<footer class="flex flex-col gap-2">
		<header>
			<h2 class="text-xl text-stone-100">Add/Remove Elements</h2>
		</header>
		<nav>
			<button
				class="h-10 rounded-lg bg-emerald-400 px-4 py-1.5 leading-none font-medium text-stone-800"
				(click)="addCube()"
				type="button"
			>
				Add cube
			</button>
		</nav>
		<ul class="flex flex-wrap items-baseline gap-1.5">
			@for (mesh of meshController.getMeshesNames(); track mesh.id) {
			<li
				class="flex items-center gap-0.5 text-sm text-stone-400 transition select-none hover:text-emerald-400"
			>
				ID: {{mesh.id}} - {{ mesh.name}}
				<button
					class="cursor-pointer text-sm leading-none font-bold text-rose-400"
					(click)="removeObject(mesh.id, 'Mesh')"
					type="button"
				>
					X
				</button>
			</li>
			}
		</ul>
	</footer>
</main>
